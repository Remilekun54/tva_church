<div id="payment-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-primary/90 backdrop-blur-md" onclick="togglePaymentModal(false)"></div>
    
    <div class="bg-white w-full max-w-md rounded-[3rem] p-10 relative z-10 shadow-2xl border-b-8 border-secondary">
        <button onclick="togglePaymentModal(false)" class="absolute top-6 right-6 text-slate-300 hover:text-primary transition-colors">
            <i data-lucide="x-circle" class="w-8 h-8"></i>
        </button>
        
        <div class="text-center">
            <div class="w-20 h-20 bg-secondary/20 rounded-3xl flex items-center justify-center mx-auto mb-6 text-secondary rotate-3">
                <i data-lucide="banknote" class="w-10 h-10"></i>
            </div>
            
            <h3 id="modal-item-title" class="text-2xl font-black text-primary mb-1">Payment Details</h3>
            <p id="modal-item-price" class="text-secondary font-black text-xl mb-6">₦0.00</p>
            
            <div class="space-y-4 text-left">
                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                    <p class="text-[10px] uppercase tracking-widest font-black text-slate-400 mb-1">Bank Name</p>
                    <p class="text-lg font-black text-primary">{{ bank_info.bank_name|default:"Not Configured" }}</p>
                </div>

                <div class="bg-slate-50 p-5 rounded-2xl border-2 border-dashed border-secondary/30 relative">
                    <p class="text-[10px] uppercase tracking-widest font-black text-slate-400 mb-1">Account Number</p>
                    <div class="flex justify-between items-center">
                        <p id="acc-num" class="text-3xl font-black text-primary tracking-tighter">{{ bank_info.account_number|default:"0000000000" }}</p>
                        <button onclick="copyAccount()" class="text-secondary hover:text-primary p-2">
                            <i data-lucide="copy" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                    <p class="text-[10px] uppercase tracking-widest font-black text-slate-400 mb-1">Account Name</p>
                    <p class="text-lg font-black text-primary uppercase">{{ bank_info.account_name|default:"GOGAP Sanctuary" }}</p>
                </div>
            </div>

            <button onclick="sendWhatsAppProof()" class="w-full mt-8 bg-emerald-500 text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-emerald-600 transition-all flex items-center justify-center gap-3">
                <i data-lucide="message-circle" class="w-6 h-6"></i>
                Send WhatsApp Proof
            </button>
        </div>
    </div>
</div>
